<svg viewBox="0 0 680 325" role="img" aria-labelledby="cg-title cg-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="cg-title">When command groups finish</title>
  <desc id="cg-desc">Four timelines. Sequence: A runs, then B runs, and the group ends when B ends. Parallel: A and B start together; A ends first and the group ends when B ends. Race: A and B start together; the group ends when A ends and B is interrupted. Deadline: A is the deadline; B ends early, and the group ends when A ends.</desc>

  <g class="d-text d-mono">
    <text x="20" y="53">sequence(A, B)</text>
    <text x="20" y="123">parallel(A, B)</text>
    <text x="20" y="193">race(A, B)</text>
    <text x="20" y="263">deadline(A, B)</text>
  </g>

  <!-- sequence -->
  <rect x="150" y="30" width="170" height="16" rx="3" class="d-accent-soft"/>
  <rect x="150" y="30" width="170" height="16" rx="3" class="d-accent-line" stroke-width="1.5"/>
  <rect x="320" y="52" width="190" height="16" rx="3" class="d-info-soft"/>
  <rect x="320" y="52" width="190" height="16" rx="3" class="d-info-line" stroke-width="1.5"/>
  <text x="158" y="42.5" class="d-text d-mono">A</text>
  <text x="328" y="64.5" class="d-text d-mono">B</text>
  <line x1="510" y1="22" x2="510" y2="76" class="d-accent-line" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- parallel -->
  <rect x="150" y="100" width="170" height="16" rx="3" class="d-accent-soft"/>
  <rect x="150" y="100" width="170" height="16" rx="3" class="d-accent-line" stroke-width="1.5"/>
  <rect x="150" y="122" width="360" height="16" rx="3" class="d-info-soft"/>
  <rect x="150" y="122" width="360" height="16" rx="3" class="d-info-line" stroke-width="1.5"/>
  <text x="158" y="112.5" class="d-text d-mono">A</text>
  <text x="158" y="134.5" class="d-text d-mono">B</text>
  <line x1="510" y1="92" x2="510" y2="146" class="d-accent-line" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- race -->
  <rect x="150" y="170" width="170" height="16" rx="3" class="d-accent-soft"/>
  <rect x="150" y="170" width="170" height="16" rx="3" class="d-accent-line" stroke-width="1.5"/>
  <rect x="150" y="192" width="170" height="16" rx="3" class="d-info-soft"/>
  <rect x="150" y="192" width="170" height="16" rx="3" class="d-info-line" stroke-width="1.5"/>
  <rect x="320" y="192" width="190" height="16" rx="3" class="d-rule" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="158" y="182.5" class="d-text d-mono">A</text>
  <text x="158" y="204.5" class="d-text d-mono">B</text>
  <text x="330" y="204" class="d-small">B interrupted</text>
  <line x1="320" y1="162" x2="320" y2="216" class="d-accent-line" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- deadline -->
  <rect x="150" y="240" width="270" height="16" rx="3" class="d-accent-soft"/>
  <rect x="150" y="240" width="270" height="16" rx="3" class="d-accent-line" stroke-width="1.5"/>
  <rect x="150" y="262" width="110" height="16" rx="3" class="d-info-soft"/>
  <rect x="150" y="262" width="110" height="16" rx="3" class="d-info-line" stroke-width="1.5"/>
  <text x="158" y="252.5" class="d-text d-mono">A (deadline)</text>
  <text x="158" y="274.5" class="d-text d-mono">B</text>
  <text x="270" y="274" class="d-small">B finished early</text>
  <line x1="420" y1="232" x2="420" y2="286" class="d-accent-line" stroke-width="2" stroke-dasharray="5 3"/>

  <line x1="150" y1="302" x2="650" y2="302" class="d-rule" stroke-width="1.5"/>
  <text x="650" y="318" class="d-small" text-anchor="end">time →</text>
</svg>
