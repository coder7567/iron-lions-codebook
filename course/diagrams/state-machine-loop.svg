<svg viewBox="0 0 620 330" role="img" aria-labelledby="sm-title sm-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="sm-title">One loop of a state-machine subsystem</title>
  <desc id="sm-desc">Every 20 milliseconds, a subsystem reads its sensors into inputs, logs them, decides the current state from the wanted state and those inputs, applies that state by sending outputs to the IO layer, and logs the decision. Commands set the wanted state from outside the loop.</desc>
  <defs>
    <marker id="sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="d-ink"/>
    </marker>
  </defs>

  <rect x="20" y="130" width="150" height="60" rx="6" class="d-soft"/>
  <rect x="20" y="130" width="150" height="60" rx="6" class="d-line" stroke-width="1.5"/>
  <text x="95" y="155" class="d-text d-mono" text-anchor="middle">setWantedState()</text>
  <text x="95" y="175" class="d-small" text-anchor="middle">from a command</text>

  <rect x="220" y="20" width="250" height="40" rx="6" class="d-surface"/>
  <rect x="220" y="20" width="250" height="40" rx="6" class="d-line" stroke-width="1.5"/>
  <text x="236" y="45" class="d-text d-mono">io.updateInputs(inputs)</text>

  <rect x="220" y="80" width="250" height="40" rx="6" class="d-surface"/>
  <rect x="220" y="80" width="250" height="40" rx="6" class="d-line" stroke-width="1.5"/>
  <text x="236" y="105" class="d-text d-mono">Logger.processInputs(...)</text>

  <rect x="220" y="140" width="250" height="40" rx="6" class="d-accent-soft"/>
  <rect x="220" y="140" width="250" height="40" rx="6" class="d-accent-line" stroke-width="2"/>
  <text x="236" y="165" class="d-text d-mono">currentState = updateState()</text>

  <rect x="220" y="200" width="250" height="40" rx="6" class="d-accent-soft"/>
  <rect x="220" y="200" width="250" height="40" rx="6" class="d-accent-line" stroke-width="2"/>
  <text x="236" y="225" class="d-text d-mono">applyState()</text>

  <rect x="220" y="260" width="250" height="40" rx="6" class="d-surface"/>
  <rect x="220" y="260" width="250" height="40" rx="6" class="d-line" stroke-width="1.5"/>
  <text x="236" y="285" class="d-text d-mono">Logger.recordOutput(...)</text>

  <g class="d-small">
    <text x="485" y="45">read every sensor</text>
    <text x="485" y="105">log what was read</text>
    <text x="485" y="165">decide what to do</text>
    <text x="485" y="225">send outputs to the IO</text>
    <text x="485" y="285">log the decision</text>
  </g>

  <g class="d-line" stroke-width="1.5" fill="none">
    <line x1="170" y1="160" x2="214" y2="160" marker-end="url(#sm-arrow)"/>
    <line x1="345" y1="60" x2="345" y2="74" marker-end="url(#sm-arrow)"/>
    <line x1="345" y1="120" x2="345" y2="134" marker-end="url(#sm-arrow)"/>
    <line x1="345" y1="180" x2="345" y2="194" marker-end="url(#sm-arrow)"/>
    <line x1="345" y1="240" x2="345" y2="254" marker-end="url(#sm-arrow)"/>
    <path d="M220 280 L196 280 L196 40 L214 40" marker-end="url(#sm-arrow)"/>
  </g>
  <text x="200" y="316" class="d-small">next loop, 20 ms later</text>
</svg>
