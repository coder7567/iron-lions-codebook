<svg viewBox="0 0 680 300" role="img" aria-labelledby="sk-title sk-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="sk-title">Swerve kinematics: translation plus rotation</title>
  <desc id="sk-desc">Three robots seen from above with the front to the right. In the first, every module points forward at the same speed, which is pure translation. In the second, each module points tangentially around the center, which is pure rotation. In the third, the two vectors are added per module, so every module ends up with a different speed and angle.</desc>
  <defs>
    <marker id="sk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="d-accent"/>
    </marker>
  </defs>

  <!-- panel 1: translation -->
  <rect x="55" y="95" width="110" height="110" rx="6" class="d-soft"/>
  <rect x="55" y="95" width="110" height="110" rx="6" class="d-line" stroke-width="1.5"/>
  <g class="d-accent-line" stroke-width="2" fill="none" marker-end="url(#sk-arrow)">
    <line x1="165" y1="95" x2="205" y2="95"/>
    <line x1="165" y1="205" x2="205" y2="205"/>
    <line x1="55" y1="95" x2="95" y2="95"/>
    <line x1="55" y1="205" x2="95" y2="205"/>
  </g>
  <text x="110" y="245" class="d-text d-mono" text-anchor="middle">translate</text>
  <text x="110" y="264" class="d-small" text-anchor="middle">same speed, same angle</text>

  <!-- panel 2: rotation -->
  <rect x="285" y="95" width="110" height="110" rx="6" class="d-soft"/>
  <rect x="285" y="95" width="110" height="110" rx="6" class="d-line" stroke-width="1.5"/>
  <g class="d-accent-line" stroke-width="2" fill="none" marker-end="url(#sk-arrow)">
    <line x1="395" y1="95" x2="367" y2="67"/>
    <line x1="395" y1="205" x2="423" y2="177"/>
    <line x1="285" y1="95" x2="257" y2="123"/>
    <line x1="285" y1="205" x2="313" y2="233"/>
  </g>
  <text x="340" y="245" class="d-text d-mono" text-anchor="middle">rotate</text>
  <text x="340" y="264" class="d-small" text-anchor="middle">same speed, angles differ</text>

  <!-- panel 3: combined -->
  <rect x="515" y="95" width="110" height="110" rx="6" class="d-soft"/>
  <rect x="515" y="95" width="110" height="110" rx="6" class="d-line" stroke-width="1.5"/>
  <g class="d-accent-line" stroke-width="2" fill="none" marker-end="url(#sk-arrow)">
    <line x1="625" y1="95" x2="655" y2="85"/>
    <line x1="625" y1="205" x2="675" y2="215"/>
    <line x1="515" y1="95" x2="545" y2="105"/>
    <line x1="515" y1="205" x2="565" y2="195"/>
  </g>
  <text x="570" y="245" class="d-text d-mono" text-anchor="middle">both at once</text>
  <text x="570" y="264" class="d-small" text-anchor="middle">every module differs</text>

  <text x="110" y="40" class="d-small" text-anchor="middle">front is to the right</text>
  <g class="d-line" stroke-width="1.5" fill="none">
    <line x1="80" y1="55" x2="140" y2="55" marker-end="url(#sk-arrow)"/>
  </g>
  <text x="340" y="40" class="d-small" text-anchor="middle">+</text>
  <text x="570" y="40" class="d-small" text-anchor="middle">=</text>
</svg>
