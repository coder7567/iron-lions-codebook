<svg viewBox="0 0 680 270" role="img" aria-labelledby="cl2-title cl2-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="cl2-title">A closed loop with feedforward</title>
  <desc id="cl2-desc">The setpoint splits two ways. One branch goes to a feedforward model that predicts the voltage the mechanism needs. The other is compared with the measurement to make an error, which a PID controller turns into a correction. The two are added and sent to the motor. The encoder measurement feeds back to the comparison.</desc>
  <defs>
    <marker id="cl2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="d-ink"/>
    </marker>
  </defs>

  <rect x="20" y="115" width="110" height="40" rx="6" class="d-soft"/>
  <rect x="20" y="115" width="110" height="40" rx="6" class="d-line" stroke-width="1.5"/>
  <text x="75" y="140" class="d-text d-mono" text-anchor="middle">setpoint</text>

  <circle cx="180" cy="135" r="18" class="d-surface"/>
  <circle cx="180" cy="135" r="18" class="d-line" stroke-width="1.5"/>
  <text x="180" y="140" class="d-text" text-anchor="middle">−</text>

  <rect x="230" y="40" width="130" height="40" rx="6" class="d-info-soft"/>
  <rect x="230" y="40" width="130" height="40" rx="6" class="d-info-line" stroke-width="1.5"/>
  <text x="295" y="65" class="d-text d-mono" text-anchor="middle">feedforward</text>

  <rect x="230" y="115" width="130" height="40" rx="6" class="d-accent-soft"/>
  <rect x="230" y="115" width="130" height="40" rx="6" class="d-accent-line" stroke-width="2"/>
  <text x="295" y="140" class="d-text d-mono" text-anchor="middle">PID</text>

  <circle cx="410" cy="135" r="18" class="d-surface"/>
  <circle cx="410" cy="135" r="18" class="d-line" stroke-width="1.5"/>
  <text x="410" y="140" class="d-text" text-anchor="middle">+</text>

  <rect x="460" y="115" width="180" height="40" rx="6" class="d-surface"/>
  <rect x="460" y="115" width="180" height="40" rx="6" class="d-line" stroke-width="1.5"/>
  <text x="550" y="140" class="d-text" text-anchor="middle">motor and mechanism</text>

  <g class="d-line" stroke-width="1.5" fill="none">
    <line x1="130" y1="135" x2="160" y2="135" marker-end="url(#cl2-arrow)"/>
    <path d="M145 135 L145 60 L226 60" marker-end="url(#cl2-arrow)"/>
    <line x1="198" y1="135" x2="226" y2="135" marker-end="url(#cl2-arrow)"/>
    <line x1="360" y1="135" x2="388" y2="135" marker-end="url(#cl2-arrow)"/>
    <path d="M360 60 L410 60 L410 113" marker-end="url(#cl2-arrow)"/>
    <line x1="428" y1="135" x2="456" y2="135" marker-end="url(#cl2-arrow)"/>
    <path d="M640 155 L640 220 L180 220 L180 157" marker-end="url(#cl2-arrow)"/>
  </g>

  <text x="205" y="126" class="d-small">error</text>
  <text x="432" y="126" class="d-small">volts</text>
  <text x="152" y="112" class="d-small">+</text>
  <text x="300" y="240" class="d-small" text-anchor="middle">measured position or velocity, from the encoder</text>
</svg>
