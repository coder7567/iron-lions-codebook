<svg viewBox="0 0 680 400" role="img" aria-labelledby="cs-title cs-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="cs-title">The FRC control system on the 2026 robot</title>
  <desc id="cs-desc">The 12 volt battery feeds a 120 amp main breaker and then the power distribution hub, which powers the roboRIO, the radio, the coprocessor, and every motor controller. The CAN bus runs as a chain from the roboRIO through the power distribution hub and the 18 SPARK motor controllers. The roboRIO talks to the radio over Ethernet; the coprocessor running PhotonVision connects over Ethernet and has two cameras. The radio links to the Driver Station laptop over Wi-Fi. The NavX gyro plugs into the roboRIO.</desc>

  <!-- legend -->
  <line x1="20" y1="24" x2="52" y2="24" class="d-accent-line" stroke-width="4"/>
  <text x="60" y="28" class="d-small">power</text>
  <line x1="110" y1="24" x2="142" y2="24" class="d-info-line" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="150" y="28" class="d-small">CAN bus</text>
  <line x1="215" y1="24" x2="247" y2="24" class="d-line" stroke-width="1.8"/>
  <text x="255" y="28" class="d-small">Ethernet</text>
  <line x1="318" y1="24" x2="350" y2="24" class="d-line" stroke-width="1.8" stroke-dasharray="2 4"/>
  <text x="358" y="28" class="d-small">Wi-Fi</text>

  <!-- power wiring -->
  <g class="d-accent-line" stroke-width="4" fill="none">
    <path d="M100 205 H130"/>
    <path d="M190 205 H220"/>
    <path d="M300 180 V120 H400"/>
    <path d="M330 205 H540"/>
    <path d="M300 230 V330"/>
    <path d="M330 222 H380 V300 H400"/>
  </g>

  <!-- CAN chain -->
  <g class="d-info-line" stroke-width="3" stroke-dasharray="7 4" fill="none">
    <path d="M430 148 V196 H330"/>
    <path d="M250 232 V350 H120"/>
  </g>

  <!-- Ethernet and Wi-Fi -->
  <g class="d-line" stroke-width="1.8" fill="none">
    <path d="M530 100 H600 V180"/>
    <path d="M540 325 H600 V232"/>
  </g>
  <path d="M630 232 C650 270 650 300 620 320" class="d-line" stroke-width="1.8" stroke-dasharray="2 4" fill="none"/>

  <!-- battery & breaker -->
  <rect x="20" y="180" width="80" height="50" rx="6" class="d-soft"/>
  <rect x="20" y="180" width="80" height="50" rx="6" class="d-line" stroke-width="1.5"/>
  <text x="60" y="202" class="d-title" text-anchor="middle">Battery</text>
  <text x="60" y="219" class="d-small" text-anchor="middle">12 V</text>
  <rect x="130" y="190" width="60" height="30" rx="4" class="d-soft"/>
  <rect x="130" y="190" width="60" height="30" rx="4" class="d-line" stroke-width="1.5"/>
  <text x="160" y="210" class="d-small" text-anchor="middle">120 A main</text>

  <!-- PDH -->
  <rect x="220" y="180" width="110" height="52" rx="6" class="d-accent-soft"/>
  <rect x="220" y="180" width="110" height="52" rx="6" class="d-accent-line" stroke-width="2"/>
  <text x="275" y="202" class="d-title" text-anchor="middle">PDH</text>
  <text x="275" y="220" class="d-small" text-anchor="middle">breakers · current</text>

  <!-- roboRIO + NavX -->
  <rect x="400" y="72" width="130" height="76" rx="6" class="d-surface"/>
  <rect x="400" y="72" width="130" height="76" rx="6" class="d-line" stroke-width="2"/>
  <text x="465" y="98" class="d-title" text-anchor="middle">roboRIO 2</text>
  <text x="465" y="116" class="d-small" text-anchor="middle">runs robot code</text>
  <text x="465" y="132" class="d-small d-mono" text-anchor="middle">10.9.67.2</text>
  <rect x="408" y="44" width="56" height="24" rx="3" class="d-warn-soft"/>
  <rect x="408" y="44" width="56" height="24" rx="3" class="d-line" stroke-width="1.2"/>
  <text x="436" y="60" class="d-small" text-anchor="middle">NavX</text>

  <!-- radio -->
  <rect x="560" y="180" width="100" height="52" rx="6" class="d-surface"/>
  <rect x="560" y="180" width="100" height="52" rx="6" class="d-line" stroke-width="2"/>
  <text x="610" y="202" class="d-title" text-anchor="middle">Radio</text>
  <text x="610" y="220" class="d-small d-mono" text-anchor="middle">10.9.67.1</text>

  <!-- coprocessor + cameras -->
  <rect x="400" y="290" width="140" height="56" rx="6" class="d-surface"/>
  <rect x="400" y="290" width="140" height="56" rx="6" class="d-line" stroke-width="2"/>
  <text x="470" y="312" class="d-title" text-anchor="middle">Coprocessor</text>
  <text x="470" y="330" class="d-small" text-anchor="middle">PhotonVision</text>
  <rect x="410" y="358" width="54" height="22" rx="3" class="d-info-soft"/>
  <text x="437" y="373" class="d-small" text-anchor="middle">cam 1</text>
  <rect x="476" y="358" width="54" height="22" rx="3" class="d-info-soft"/>
  <text x="503" y="373" class="d-small" text-anchor="middle">cam 2</text>

  <!-- Driver Station laptop -->
  <rect x="560" y="300" width="110" height="52" rx="6" class="d-soft"/>
  <rect x="560" y="300" width="110" height="52" rx="6" class="d-line" stroke-width="1.5"/>
  <text x="615" y="322" class="d-title" text-anchor="middle">DS laptop</text>
  <text x="615" y="340" class="d-small" text-anchor="middle">+ controllers</text>

  <!-- SPARK chain -->
  <g>
    <rect x="30" y="330" width="44" height="40" rx="4" class="d-surface"/><rect x="30" y="330" width="44" height="40" rx="4" class="d-line" stroke-width="1.2"/>
    <rect x="80" y="330" width="44" height="40" rx="4" class="d-surface"/><rect x="80" y="330" width="44" height="40" rx="4" class="d-line" stroke-width="1.2"/>
    <rect x="130" y="330" width="44" height="40" rx="4" class="d-surface"/><rect x="130" y="330" width="44" height="40" rx="4" class="d-line" stroke-width="1.2"/>
    <text x="52" y="355" class="d-small d-mono" text-anchor="middle">1</text>
    <text x="102" y="355" class="d-small d-mono" text-anchor="middle">2</text>
    <text x="152" y="355" class="d-small" text-anchor="middle">…18</text>
    <text x="30" y="392" class="d-small">18 SPARK MAX / Flex controllers</text>
  </g>
</svg>
